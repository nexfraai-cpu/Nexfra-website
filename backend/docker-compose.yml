services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    command: npm run dev
    restart: unless-stopped
